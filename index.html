<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profiles</title>
    <!-- <link rel="stylesheet" href="profile.css"> -->
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    
    <div class="container">
        <div class="actions">
            <img src="icons/user.png" alt="" id="add-user">
            <img src="icons/up-arrow.png" alt="" id="up-icon">
            <img src="icons/down-arrow.png" alt="" id="down-icon">
        </div>

        <div class="stack">
        </div>

        <div class="no-data-found">
            <h1>NO DATA FOUND...</h1>
        </div>
        
    </div>
    
        <div class="form-container">
            <h2>Create Profile</h2>
            
            <form action="" method="">
            
                <!-- Image URL Field -->
                <div class="form-group">
                    <label for="imageURL">Image URL</label>
                    <input autocomplete="off" type="text" name="imageURL" id="imageURL" placeholder="https://example.com" required>
                </div>

                <!-- Name Field -->
                <div class="form-group">
                    <label for="userName">Full Name</label>
                    <input autocomplete="off" type="text" name="userName" id="userName" placeholder="Full Name" required>
                </div>

                <div class="form-group">
                    <label for="userId">User ID</label>
                    <input autocomplete="off" type="text" name="userId" id="userId" placeholder="User ID" minlength="8" maxlength="15" required>
                </div>

                <!-- Profession Radio Group -->
                <fieldset class="form-group">
                    <legend><label for="developer">Role</label></legend>
                    <div class="radio-group">
                        <label class="radio-option" for="developer">
                            <input type="radio" name="role" id="developer" value="Developer" required>
                            Developer
                        </label>
                        <label class="radio-option" for="analyst">
                            <input type="radio" name="role" id="analyst" value="Analyst" required>
                            Analyst
                        </label>
                        <label class="radio-option" for="trainer">
                            <input type="radio" name="role" id="trainer" value="Trainer" required>
                            Trainer
                        </label>
                    </div>
                </fieldset>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="userEmail">Email</label>
                    <input type="email" name="userEmail" id="userEmail" placeholder="you@example.com" required>
                </div>

                <!-- Actions -->
                <div class="button-group">
                    <input type="submit" value="Create ID">
                    <input type="reset" value="Reset">
                    <button type="button" class="btn-cancel" onclick="cancelForm()">Cancel</button>
                </div>
            
            </form>
        </div>

        <div class="edit-form-container">
            <h2>Edit Profile</h2>
            
            <form action="" method="">
            
                <!-- Image URL Field -->
                <div class="form-group">
                    <label for="imageURL">Image URL</label>
                    <input autocomplete="off" type="text" name="imageURL" id="imageURL" placeholder="https://example.com" required>
                </div>

                <!-- Name Field -->
                <div class="form-group">
                    <label for="userName">Full Name</label>
                    <input autocomplete="off" type="text" name="userName" id="userName" placeholder="Full Name" required>
                </div>

                <div class="form-group">
                    <label for="userId">User ID</label>
                    <input autocomplete="off" type="text" name="userId" id="userId" placeholder="User ID" minlength="8" maxlength="15" required>
                </div>

                <!-- Profession Radio Group -->
                <fieldset class="form-group">
                    <legend><label for="developer">Role</label></legend>
                    <div class="radio-group">
                        <label class="radio-option" for="developer">
                            <input type="radio" name="role" id="developer" value="Developer" required>
                            Developer
                        </label>
                        <label class="radio-option" for="analyst">
                            <input type="radio" name="role" id="analyst" value="Analyst" required>
                            Analyst
                        </label>
                        <label class="radio-option" for="trainer">
                            <input type="radio" name="role" id="trainer" value="Trainer" required>
                            Trainer
                        </label>
                    </div>
                </fieldset>

                <!-- Email Field -->
                <div class="form-group">
                    <label for="userEmail">Email</label>
                    <input type="email" name="userEmail" id="userEmail" placeholder="you@example.com" required>
                </div>

                <!-- Actions -->
                <div class="button-group">
                    <input type="submit" value="Save ID">
                    <input type="reset" value="Reset">
                    <button type="button" class="btn-cancel" onclick="cancelForm()">Cancel</button>
                </div>
            
            </form>
        </div>
    <script src="profile.js"></script>
</body>
</html>
